name: Docker build

on:
  push:
    branches:
      - 'main'
  pull_request:

jobs:
  docker-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Docker meta
        id: docker_meta
        uses: crazy-max/ghaction-docker-meta@v6.2.0
        env:
          DOCKER_METADATA_ANNOTATIONS_LEVELS: index
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=sha
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4.4.1
      - name: Set up helmfile
        uses: helmfile/helmfile-action@v2.4.8
        with:
          helmfile-version: 'v0.162.0'
          helm-version: 'v3.12.2'
          helm-plugins: >
            https://github.com/databus23/helm-diff@v3.12.5
      - name: Cache Docker layers
        uses: actions/cache@v6
        with:
          path: /tmp/.buildx-cache
          key: ${{ runner.os }}-buildx-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-buildx-
      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4.6.0
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push
        id: build
        uses: docker/build-push-action@v7.4.0
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          cache-from: type=local,src=/tmp/.buildx-cache
          cache-to: type=local,mode=max,dest=/tmp/.buildx-cache
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.docker_meta.outputs.tags }}
          # Index annotations preserve traceability without changing the runnable image.
          annotations: ${{ github.event_name != 'pull_request' && steps.docker_meta.outputs.annotations || '' }}
      - name: Check out `wmde/wbaas-deploy` repository in staging child directory
        if: github.event_name != 'pull_request'
        uses: actions/checkout@v7
        with:
          repository: wmde/wbaas-deploy
          path: ./repos/wbaas-deploy-staging
      - name: Check out `wmde/wbaas-deploy` repository in production child directory
        if: github.event_name != 'pull_request'
        uses: actions/checkout@v7
        with:
          repository: wmde/wbaas-deploy
          path: ./repos/wbaas-deploy-production
      - name: Update values for local, staging and production
        if: github.event_name != 'pull_request'
        id: update-values
        shell: bash
        env:
          IMAGE: ghcr.io/${{ github.repository }}
          NEW_IMAGE: ghcr.io/${{ github.repository }}@${{ steps.build.outputs.digest }}
        run: |
          TAG="$(echo ${{ steps.docker_meta.outputs.tags }} | cut -d':' -f2)"
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          platform_digest() {
            # Select the runnable image, excluding index annotations and provenance.
            docker buildx imagetools inspect "$1" --format '{{json .Manifest}}' | jq -er '
              if .manifests then
                [.manifests[] | select(.platform.os == "linux" and .platform.architecture == "amd64")]
                | if length == 1 then .[0].digest else error("Expected one linux/amd64 manifest") end
              else .digest end
              | select(test("^sha256:[0-9a-f]{64}$"))
            '
          }
          new_digest=$(platform_digest "$NEW_IMAGE")
          for environment in local staging production; do
            repository=./repos/wbaas-deploy-staging
            if [[ $environment == production ]]; then
              repository=./repos/wbaas-deploy-production
            fi
            values="$repository/k8s/helmfile/env/$environment/api.values.yaml.gotmpl"
            current_tag=$(yq -er '.image.tag' "$values")
            current_digest=$(platform_digest "$IMAGE:$current_tag")
            changed=false
            if [[ $current_digest != "$new_digest" ]]; then
              sed -i "/image:/{n;s/tag:.*/tag: $TAG/;}" "$values"
              changed=true
            else
              echo "$environment: image unchanged; skipping deployment update"
            fi
            echo "${environment}_changed=$changed" >> "$GITHUB_OUTPUT"
          done
      - name: Update argo values for local, staging and production
        if: github.event_name != 'pull_request' && (steps.update-values.outputs.local_changed == 'true' || steps.update-values.outputs.staging_changed == 'true' || steps.update-values.outputs.production_changed == 'true')
        id: update-argo-values
        run: |
          cd ./repos/wbaas-deploy-staging
          # run generate values script for local from staging folder
          ./bin/generate-values local api
          # run generate values script for staging from staging folder
          ./bin/generate-values staging api
          # run generate values script for prod from prod folder
          cd ../wbaas-deploy-production
          ./bin/generate-values production api
      - name: Truncate commit message
        if: github.event_name != 'pull_request'
        id: truncate-commit-message
        run: |
          MSG=$(git log -1 --pretty=format:%s)
          echo "msg=$MSG" >> $GITHUB_OUTPUT
      - name: Create Staging+Local Pull Request
        uses: peter-evans/create-pull-request@v8
        if: github.event_name != 'pull_request' && (steps.update-values.outputs.local_changed == 'true' || steps.update-values.outputs.staging_changed == 'true')
        with:
          path: ./repos/wbaas-deploy-staging
          commit-message: 'Staging+Local: Deploy new Platform API image ${{ steps.docker_meta.outputs.tags }}'
          title: 'Staging+Local: Deploy new Platform API image ${{ steps.docker_meta.outputs.tags }}'
          branch: deploy-to-staging-${{ steps.update-values.outputs.tag }}
          committer: wmdebot <github-bots@wikimedia.de>
          author: wmdebot <github-bots@wikimedia.de>
          labels: automated pr
          token: ${{ secrets.WBAAS_DEPLOY_TOKEN }}
          body: |
            This is an automated update for the `api` image in staging and local, using `${{ steps.update-values.outputs.tag }}`.

            **Changes**: [${{ steps.truncate-commit-message.outputs.msg }}](https://github.com/wbstack/api/commit/${{ github.sha }})
      - name: Create Production Pull Request
        uses: peter-evans/create-pull-request@v8
        if: github.event_name != 'pull_request' && steps.update-values.outputs.production_changed == 'true'
        with:
          path: ./repos/wbaas-deploy-production
          commit-message: 'Production: Deploy new Platform API image ${{ steps.docker_meta.outputs.tags }}'
          title: 'Production: Deploy new Platform API image ${{ steps.docker_meta.outputs.tags }}'
          branch: deploy-to-production-${{ steps.update-values.outputs.tag }}
          committer: wmdebot <github-bots@wikimedia.de>
          author: wmdebot <github-bots@wikimedia.de>
          labels: automated pr
          token: ${{ secrets.WBAAS_DEPLOY_TOKEN }}
          body: |
            This is an automated update for the `api` image in production, using `${{ steps.update-values.outputs.tag }}`.

            **Changes**: [${{ steps.truncate-commit-message.outputs.msg }}](https://github.com/wbstack/api/commit/${{ github.sha }})
